name: Feedback
description: Tell us what worked, what was confusing, or what you need. Issues are public. Do not post traces, prompts, keys, personal data or anything confidential.
labels: [feedback]
body:
  - type: dropdown
    id: area
    attributes:
      label: What were you using?
      options: [Try the Auditor, Workflow Map, For developers / package, Inspect and compare, Research pages, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Describe it in your own words. Issues are public, so do not paste traces, prompts, keys, personal data or confidential material.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser or Python version (optional)
